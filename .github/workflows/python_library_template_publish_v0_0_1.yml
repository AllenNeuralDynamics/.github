name: Python Library Template Publish (v0.0.1)

on:
  workflow_call:
    inputs:
      default-branch:
        description: 'Default branch name'
        default: main
        required: false
        type: string
      python-version:
        description: 'Python version to use for building and publishing'
        default: '3.12'
        required: false
        type: string
      working-directory:
        description: 'Working directory for the build and publish tasks'
        required: false
        type: string
        default: '.'

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./${{ inputs.working-directory }}
    permissions:
      contents: read
      # IMPORTANT: this permission is mandatory for Trusted Publishing
      id-token: write
    steps:
    - uses: actions/checkout@v5
    - name: Pull latest changes
      run: git pull origin ${{ inputs.default-branch }}
    - name: Set up Python
      uses: astral-sh/setup-uv@v6
      with:
        python-version: ${{ inputs.python-version }}
    - name: Build and validate package
      run: |
        uv build
        uvx twine check dist/*
    - name: Publish on PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
